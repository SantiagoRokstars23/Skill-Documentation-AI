[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-documentation-ai"
version = "0.6.0"
description = "Motor de documentacion inteligente para microservicios Java/Spring Boot"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "javalang>=0.13.0,<0.14.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
spring-doc = "cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["analyzer", "providers", "validators", "generators", "validator", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
